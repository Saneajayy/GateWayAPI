name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        
    - name: Start backing services
      run: docker compose up -d
      
    - name: Install dependencies
      run: npm install
    
    - name: Run Unit Tests
      run: npm test

    - name: Wait for Docker services to initialize
      run: sleep 30

    - name: Start Mock Downstream
      run: npm run start:mock &
      
    - name: Start Gateway
      run: POSTGRES_PORT=5433 npm run start:gateway > gateway.log 2>&1 &
      
    - name: Start Worker
      run: npx ts-node gateway/src/worker.ts > worker.log 2>&1 &
      
    - name: Wait for apps to bind ports
      run: |
        echo "Waiting for Gateway on port 3000..."
        timeout=60
        while ! nc -z localhost 3000; do
          sleep 2
          timeout=$((timeout-2))
          if [ $timeout -le 0 ]; then
            echo "Gateway failed to start in time!"
            echo "--- Gateway Logs ---"
            cat gateway.log
            echo "--- Worker Logs ---"
            cat worker.log
            echo "--- Docker Logs ---"
            docker compose logs
            exit 1
          fi
        done
        echo "Gateway is up!"
      
    - name: Setup Tenants
      run: |
        curl -X POST http://localhost:3000/admin/tenants -H "Content-Type: application/json" -d '{"id":"tenantA","algorithm":"token_bucket","limit":500,"rateOrWindow":100}'
        curl -X POST http://localhost:3000/admin/tenants -H "Content-Type: application/json" -d '{"id":"tenantB","algorithm":"sliding_window","limit":100,"rateOrWindow":1000}'
        curl -X POST http://localhost:3000/admin/tenants -H "Content-Type: application/json" -d '{"id":"tenantC","algorithm":"token_bucket","limit":10,"rateOrWindow":1}'

    - name: Run k6 load test
      uses: grafana/k6-action@v0.3.0
      with:
        filename: load-tests/script.js
        flags: --out json=results.json
